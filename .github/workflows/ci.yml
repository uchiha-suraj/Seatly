name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start MongoDB replica set (rs0)
        run: docker compose up -d --wait mongo
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (unit, API integration against the replica set, web)
        run: npm test
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/?replicaSet=rs0
      - run: npm run build
      - name: Concurrency smoke test (100 users, two API processes)
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/seatly?replicaSet=rs0
          APP_ORIGIN: http://localhost:4001
          COOKIE_SECURE: "true" # required in production; the demo reads Set-Cookie itself
          DEMO_MODE: "true"
          ARGON2_MEMORY_KIB: "19456"
          LOG_LEVEL: warn
        run: |
          npm run seed
          npm run start:two &
          npx --yes wait-on@8 -t 30000 http://localhost:4001/api/health http://localhost:4002/api/health
          npm run demo:concurrency -- --users 100 --targets http://localhost:4001,http://localhost:4002
          npm run demo:idempotency -- --targets http://localhost:4001
      - name: Keep demo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: demo-results/
